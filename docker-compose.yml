# =============================================================================
# Edit Kit Management System - local development stack
# =============================================================================
#   docker compose up -d db        # database only (run Next.js on the host)
#   docker compose --profile app up -d --build   # full stack
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: ekms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ekms
      POSTGRES_PASSWORD: ekms_local_dev
      POSTGRES_DB: ekms
      # Deterministic collation so ORDER BY behaves identically everywhere.
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
    ports:
      - '5432:5432'
    volumes:
      - ekms-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ekms -d ekms']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # Not started by default - `docker compose up -d db` is the normal dev loop.
    profiles: ['app']
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ekms-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: 'postgresql://ekms:ekms_local_dev@db:5432/ekms?schema=public'
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set in .env}
      AUTH_TRUST_HOST: 'true'
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Dubai}
      STORAGE_PROVIDER: 'LOCAL'
      STORAGE_LOCAL_PATH: '/app/storage'
      # Sign-in methods. The directory stays off until its values are in .env
      # (docs/OPERATIONS.md §6); blank values mean "not set".
      AUTH_LOCAL_LOGIN_ENABLED: ${AUTH_LOCAL_LOGIN_ENABLED:-true}
      AUTH_LDAP_ENABLED: ${AUTH_LDAP_ENABLED:-false}
      LDAP_URL: ${LDAP_URL:-}
      LDAP_STARTTLS: ${LDAP_STARTTLS:-false}
      LDAP_TLS_CA_FILE: ${LDAP_TLS_CA_FILE:-}
      LDAP_TLS_SERVERNAME: ${LDAP_TLS_SERVERNAME:-}
      LDAP_TIMEOUT_MS: ${LDAP_TIMEOUT_MS:-5000}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_USER_BASE_DN: ${LDAP_USER_BASE_DN:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_UPN_SUFFIX: ${LDAP_UPN_SUFFIX:-}
      LDAP_USER_FILTER: ${LDAP_USER_FILTER:-(&(objectClass=user)(|(sAMAccountName={{username}})(userPrincipalName={{username}})(mail={{username}})))}
      LDAP_ID_ATTRIBUTE: ${LDAP_ID_ATTRIBUTE:-objectGUID}
      LDAP_USERNAME_ATTRIBUTE: ${LDAP_USERNAME_ATTRIBUTE:-sAMAccountName}
      LDAP_NAME_ATTRIBUTE: ${LDAP_NAME_ATTRIBUTE:-displayName}
      LDAP_EMAIL_ATTRIBUTE: ${LDAP_EMAIL_ATTRIBUTE:-mail}
      LDAP_STAFF_ID_ATTRIBUTE: ${LDAP_STAFF_ID_ATTRIBUTE:-}
      LDAP_GROUP_ATTRIBUTE: ${LDAP_GROUP_ATTRIBUTE:-memberOf}
      LDAP_AUTO_PROVISION: ${LDAP_AUTO_PROVISION:-false}
      LDAP_DEFAULT_ROLE: ${LDAP_DEFAULT_ROLE:-VIEWER}
      LDAP_ROLE_GROUPS_ADMIN: ${LDAP_ROLE_GROUPS_ADMIN:-}
      LDAP_ROLE_GROUPS_ENGINEER: ${LDAP_ROLE_GROUPS_ENGINEER:-}
      LDAP_ROLE_GROUPS_EDITOR: ${LDAP_ROLE_GROUPS_EDITOR:-}
      LDAP_ROLE_GROUPS_VIEWER: ${LDAP_ROLE_GROUPS_VIEWER:-}
    ports:
      - '3000:3000'
    volumes:
      # Signed handover evidence. Losing this volume loses the signatures.
      - ekms-storage:/app/storage

volumes:
  ekms-db-data:
  ekms-storage:
